[project]
name = "rcsl-ai-nexus"
version = "0.1.0"
description = "Self-hosted LLM gateway and management platform"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["../LICENSE"]

dependencies = [
    # 0.106-0.12x closed the yield-dependency exit stack before the response was
    # sent, which silently dropped every streaming request's usage record.
    "fastapi>=0.129",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=50.0",
    "geoip2>=4.8",
    "zxcvbn>=4.5.0",
    "segno>=1.6.6",
    # Only the MLX adapter's download path uses it, and only there: it is
    # imported lazily inside the methods that pull a snapshot, so the inference
    # path neither pays its import cost nor depends on it.
    "huggingface-hub>=0.27",
    "prometheus-client>=0.21",
    # Multipart body parsing, required by FastAPI for the one endpoint that
    # accepts a file (the knowledge base upload).
    "python-multipart>=0.0.20",
    # Document parsing. These two are the CVE surface security.md 7.3 is about,
    # and they are imported *only* by app/parser/, which runs in a container
    # with no credentials, no volumes and no network route out. Nothing in the
    # application imports them.
    "pypdf>=5.1",
    "python-docx>=1.1",
    # Counting a prompt with the model's own vocabulary rather than estimating
    # it from character widths, which was wrong by 1.34x-1.48x on ordinary
    # content and 0.36x on dense identifiers. Both are imported lazily, inside
    # the functions that build a tokeniser, so a process that never counts a
    # prompt never pays for them: `adapters/tokenizer/gguf_token_counter.py`.
    #
    # Jinja2 is here for exactly one thing — rendering the chat template that
    # ships inside the weights, so the count includes the framing the runtime
    # wraps a conversation in. It renders in a sandboxed environment because
    # what passes through that template is caller text.
    "tokenizers>=0.23.1",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
per-file-ignores = { "tests/*" = [
    "S101", # pytest relies on bare assert
    "S105", # test fixtures hardcode obvious non-secret passwords
    "S106",
], "alembic/versions/*" = [
    "E501", # machine-generated; hand-wrapping is undone on the next autogenerate
    "S608", # a migration interpolates its own hardcoded table names into DDL and
            # backfill statements; no value there comes from outside the file
], "app/infrastructure/db_roles.py" = [
    "S608", # DDL cannot be parameterised; identifiers and literals are hand-quoted, see the module docstring
] }

[tool.mypy]
python_version = "3.12"
strict = true
# Every layer is checked under strict, adapters included. An earlier config
# carried an `[[overrides]] module = "app.adapters.*" strict = false` block, but
# mypy silently ignores `strict` in a per-module override (it is a global-only
# meta-flag), so it never relaxed anything: the adapters were strict-checked all
# along, and the code is now clean under that. What third-party stub gaps remain
# are pinned with targeted casts and `type: ignore` at the call site, where they
# are visible, rather than a blanket relaxation that hides real errors too.

[[tool.mypy.overrides]]
# The Python port of zxcvbn ships no stubs. Only the score and the feedback
# strings are read, and the adapter narrows both.
module = "zxcvbn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# huggingface_hub ships no stubs and is imported lazily inside the MLX adapter's
# download seams only. Those are covered by tests that replace them.
module = "huggingface_hub.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# python-docx ships no stubs. Imported only inside app/parser/extract.py, where
# every attribute read is a string off a paragraph or cell.
module = "docx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# nexus_native is a PyO3 Rust extension built with maturin. It ships no stubs;
# the adapter narrows every return value at the call site.
module = "nexus_native.*"
ignore_missing_imports = true

[project]
name = "rcsl-ai-nexus"
version = "0.1.0"
description = "Self-hosted LLM gateway and management platform"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["../LICENSE"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=44.0",
    "geoip2>=4.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: pytest relies on bare assert.
per-file-ignores = { "tests/*" = ["S101"] }

[tool.mypy]
python_version = "3.12"
strict = true
# The domain layer is the part worth being strict about; adapters wrap
# third-party libraries whose stubs are often incomplete.
[[tool.mypy.overrides]]
module = "app.adapters.*"
strict = false

name: CI

# What this exists to catch. Every quality gate this repository had ran on the
# machine of whoever was committing: pre-commit hooks that a `--no-verify`
# skips, and two test suites nobody but the author ran. The integration suite in
# particular needs a Postgres, so it was the easiest thing in the repo to leave
# unrun — and it is the suite that found the account-split test asserting
# nothing (PROGRESS.md 2026-07-26). A gate that only runs where the code was
# written is a gate that eventually does not run.
#
# The runners are GitHub-hosted Linux, which is deliberately *not* the
# deployment: the Mac Studio's GPU, the tailnet and nginx cannot be reproduced
# here and nothing below pretends otherwise. What CI checks is the half that is
# platform-independent — types, lint, unit and integration behaviour against a
# real Postgres, and the dependency surface. The rest is verified by deploying,
# which is what the runbook is for.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so the audit jobs report a newly published advisory against
  # unchanged code. A vulnerability disclosed on a Tuesday should not wait for
  # someone to happen to commit.
  schedule:
    - cron: '0 4 * * 3'
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # The same major version Compose runs, because the integration suite
      # asserts against real Postgres behaviour — role grants, `date_trunc`
      # bucketing, tenant filters — and none of that is guaranteed to be
      # identical on another version.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: devpw
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        # --frozen, so a lockfile that does not match pyproject.toml fails here
        # rather than being silently updated into a resolution nobody reviewed.
        run: uv sync --frozen

      - name: Ruff (lint)
        working-directory: backend
        run: uv run ruff check app tests alembic

      - name: Ruff (format)
        working-directory: backend
        # `--check` only. CI reports formatting; it never rewrites the tree,
        # because a job that pushes formatting commits is a job that can push.
        run: uv run ruff format --check app tests alembic

      - name: mypy (strict)
        working-directory: backend
        run: uv run mypy app

      - name: Unit tests
        working-directory: backend
        # No TEST_DATABASE_URL: the integration tests skip, which is the same
        # arrangement a developer gets, and proves the unit suite really is
        # independent of a database rather than quietly relying on one.
        run: uv run pytest tests/unit -q

      - name: Integration tests, against a real Postgres
        working-directory: backend
        env:
          # Deliberately not DATABASE_URL. The variable is separate precisely so
          # the unit suite can never reach a database by accident, and these
          # tests drop and recreate the schema on every run.
          TEST_DATABASE_URL: postgresql+asyncpg://nexus:devpw@127.0.0.1:5432/nexus
        run: uv run pytest tests/integration -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # The pnpm version comes from `packageManager`, and that field lives in
          # frontend/package.json — there is no package.json at the repository
          # root. Without this the action reads the default `./package.json`,
          # finds nothing, and the job fails before pnpm is installed at all.
          # `working-directory` cannot fix it: it applies to `run` steps only.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        # --frozen-lockfile is the default in CI; naming it makes the intent
        # explicit rather than environment-dependent.
        run: pnpm install --frozen-lockfile

      # The generated types are committed, so `tsc` above checks the schemas
      # against whatever was committed rather than against the backend as it is
      # now. Regenerating here and failing on a diff is what closes that gap: a
      # backend change that renames or retypes a field turns red in this job
      # instead of turning up in a browser. uv is installed for this step alone,
      # which is cheap next to being wrong about the contract.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Generated API types and role map are current
        run: |
          ./scripts/generate-api-types.sh
          git diff --exit-code -- frontend/src/lib/generated/admin-api.ts || {
            echo "::error::admin-api.ts is stale. Run scripts/generate-api-types.sh and commit the result."
            exit 1
          }
          # The role map is checked here for the reason the file itself records:
          # the copy this replaced drifted from role_authorization.py twice in
          # one day, and both times the frontend suite stayed green while
          # asserting a navigation no real role is shown. A scope added to a
          # role now fails this step until it is regenerated.
          git diff --exit-code -- frontend/src/lib/generated/role-scopes.ts || {
            echo "::error::role-scopes.ts is stale. Run scripts/generate-api-types.sh and commit the result."
            exit 1
          }
          # And the audit action catalogue, for the third instance of the same
          # defect: the hand-kept list behind the /admin/logs filter had drifted
          # by eight names, and the filter matches exactly, so each missing name
          # was an action nobody could filter for without knowing its spelling.
          git diff --exit-code -- frontend/src/lib/generated/audit-actions.ts || {
            echo "::error::audit-actions.ts is stale. Run scripts/generate-api-types.sh and commit the result."
            exit 1
          }

      - name: TypeScript
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: pnpm lint

      - name: Vitest
        working-directory: frontend
        run: pnpm test

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # This produces its own production build first: the browser meets the
      # application as it ships, not as `next dev` compiles it. That build
      # writes to `.next-e2e` and inlines a test CSRF cookie name, so it is
      # deliberately not the artefact the Build step below checks.
      #
      # Sized one minute above the runner's own deadlines (five for the build,
      # ten for the tests) so that a hang is reported by the runner, which can
      # say which half of the work stalled, rather than by a step that can only
      # say it ran out of time.
      - name: Playwright
        working-directory: frontend
        timeout-minutes: 16
        run: pnpm test:e2e

      - name: Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        working-directory: frontend
        # The deployed image is `output: 'standalone'`, and a build-time failure
        # (a server/client boundary violation, a bad import) does not appear in
        # any of the checks above. This is also where the class of defect from
        # PROGRESS.md 2026-07-26 lived: a rewrite resolved at build time.
        run: pnpm build

  # The browser-to-Postgres join, in its own job rather than as a step in
  # `frontend`. It needs the backend's Python environment and a database, which
  # nothing else in that job does, and keeping it separate means the paths that
  # need no database stay runnable when this one is broken or slow.
  e2e-full-stack:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: devpw
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # The runner drops and rebuilds this schema from Alembic on every run, so
      # it must be a database nothing else is using. The service container above
      # exists for that and nothing else.
      - name: Browser to gateway
        working-directory: frontend
        # One minute above the runner's own worst case, the same rule the
        # frontend job states: three for the seed, two apiece for the two
        # backends to answer /healthz, five for the Next build and ten for the
        # tests is 22, so a stall is reported by the runner -- which can say
        # which half stalled -- rather than by a step that can only say it ran
        # out of time.
        timeout-minutes: 23
        env:
          E2E_DATABASE_URL: postgresql+asyncpg://nexus:devpw@127.0.0.1:5432/nexus
        run: pnpm test:e2e:full

      - name: Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-full-stack
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    # `continue-on-error` is on each scanning step below, **not on this job**,
    # and the difference was learned the hard way on the first run: with it here,
    # `aquasecurity/trivy-action@0.29.0` (the tag is `v0.29.0`) failed to resolve,
    # the whole job died in "Set up job" before a single scanner ran, and the run
    # still reported success. A scanning job that has never executed while the
    # pipeline shows green is precisely the "designed, written down, marked done,
    # and not actually in force" defect this repository keeps finding in itself.
    #
    # Per-step instead: a broken workflow, a failed install or an unreachable
    # advisory database fails this job and is visible, because those are ours to
    # fix. A scanner that *ran* and found something does not, because that fires
    # when someone else publishes an advisory rather than when this repository
    # changes — and an unrelated CVE blocking an unrelated fix is how a red
    # pipeline stops being read at all.

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: pip-audit
        continue-on-error: true
        working-directory: backend
        # Against the locked resolution rather than the declared ranges, so the
        # report names what would actually be installed. `uv tool run` keeps
        # pip-audit out of the project's own dependency set.
        #
        # The findings go to the run summary, not only to the log. A
        # `continue-on-error` step reports its conclusion as success whatever it
        # found, so the log is the only place the result exists — and fetching
        # logs needs admin rights on the repository, which the person most likely
        # to read this does not have. A report nobody can reach is the same as no
        # report, which is the argument this whole job rests on.
        run: |
          uv export --frozen --no-dev --format requirements-txt > /tmp/requirements.txt
          echo '## pip-audit (backend, production resolution)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv tool run pip-audit --requirement /tmp/requirements.txt --strict \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - uses: pnpm/action-setup@v6
        with:
          # See the frontend job: `packageManager` is in frontend/package.json.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm audit
        continue-on-error: true
        working-directory: frontend
        # `--prod` first: a vulnerability in a build-time devDependency does not
        # ship in the image, and mixing the two makes the report unreadable.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          echo '## pnpm audit (frontend, production dependencies)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm audit --prod --audit-level moderate 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Trivy, filesystem
        continue-on-error: true
        # `v0.36.0`, with the `v`. The tag without it does not exist, and a
        # `uses:` that cannot be resolved kills the job in "Set up job" before
        # any step runs — see the note on this job.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          # `vuln,secret` and deliberately **not** `misconfig`. The Dockerfile
          # and Compose misconfiguration rules have never been run against this
          # repository, so turning them on here would publish a wall of
          # untriaged findings — and several would be things this deployment
          # chose on purpose and recorded in security.md §15. An unread report
          # is worse than no report, which is the same reasoning that makes this
          # whole job advisory. Turning misconfig on is its own piece of work:
          # run it once by hand, decide each finding, and add the ones that
          # remain as ignores with a reason before it becomes a step here.
          scanners: vuln,secret
          # HIGH and CRITICAL only. At MEDIUM the base-image noise buries
          # everything that would be acted on.
          severity: HIGH,CRITICAL
          # A vulnerability with no released fix is not something a commit can
          # answer, and reporting it every run trains people to skip the job.
          ignore-unfixed: true
          exit-code: '1'
          # A file rather than the log, so the next step can put it where someone
          # without repository admin rights can actually read it.
          format: table
          output: trivy.txt

      - name: Trivy findings to the run summary
        # `always()`, because the interesting case is the one where the scan above
        # found something and stopped. Without it this step is skipped exactly
        # when there is a report to publish.
        if: always()
        run: |
          echo '## Trivy (filesystem, vuln + secret, HIGH/CRITICAL, fixed only)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -s trivy.txt ]; then
            cat trivy.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Nothing reported.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

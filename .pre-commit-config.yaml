# Install once with:  uv tool install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
        # `secrets/*.example` are templates for files whose content *is* the
        # secret, and secrets/README.md says to write them with no trailing
        # newline. This hook adds one, so without the exclusion a tool would
        # quietly reverse a rule the documentation states -- and would do it on
        # whichever templates happened to be staged, leaving the set half
        # converted. Worth knowing that the set is already half converted for
        # the opposite reason: four of the seventeen carried a trailing newline
        # on 2026-08-18, found when this hook was first installed, so the
        # exclusion preserves an inconsistency rather than a clean state.
        exclude: ^secrets/.*\.example$
      - id: trailing-whitespace
      - id: detect-private-key

  # Pinned to the ruff the project actually resolves (`uv run ruff --version`),
  # because a hook that lints with a different version than CI is a fight rather
  # than a gate. This said v0.9.6 until 2026-08-18, and installing the hook that
  # day is how it was found: 0.9.6 wanted `alembic.config` in a different import
  # group than 0.16.0 does, so the two would have taken turns rewriting
  # `tests/integration/conftest.py` on every commit that touched it, and it
  # flagged UP038 -- a rule current ruff no longer has -- against a file 0.16.0
  # passes clean. Bump this line whenever the backend's ruff moves.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # `ruff-check`, not `ruff`: the latter still resolves but announces itself
      # as a legacy alias, and an alias is one deprecation away from a hook that
      # stops running while the summary line still reads Passed.
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # A local hook rather than mirrors-mypy: mypy needs the project's real
  # dependencies to type-check against, and reproducing them as
  # additional_dependencies would be a second copy to keep in sync. `uv run`
  # uses the environment uv already resolves; `--directory backend` runs mypy
  # from where its config and package root live. Whole-package (not per-file),
  # because mypy's cross-module inference is what makes it accurate.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, strict)
        entry: uv run --directory backend mypy app
        language: system
        types: [python]
        files: ^backend/app/
        pass_filenames: false

      # Two invariants that broke on 2026-08-30, when five oversized documents
      # were split into directories and every relative link moved a level
      # deeper: a link has to resolve, and a label that looks like a path has to
      # be the path it links to. The second is the one worth a gate — seven
      # links rendered as `../ARCHITECTURE.md` while pointing at
      # `../../ARCHITECTURE.md`, so every one of them resolved and every page
      # still lied to anyone reading the displayed path. Stdlib only; it also
      # runs in CI, because a hook is skippable with --no-verify and this file's
      # own CI header says a gate that only runs where the code was written is a
      # gate that eventually does not run.
      - id: doc-links
        name: doc links resolve and labels match
        entry: python3 scripts/check-doc-links.py
        language: system
        types: [markdown]
        pass_filenames: false

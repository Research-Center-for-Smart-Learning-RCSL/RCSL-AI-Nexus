# pnpm 10 stopped reading these from the `pnpm` field in package.json. The
# allowlist below lived there until 2026-07-26 and was being silently ignored,
# which left the intent stated in one file and enforced nowhere (security.md
# §10). Everything pnpm-configurable belongs here, not there.
#
# `overrides` joined them on 2026-08-04 for the same reason: it was written into
# `package.json` first, where pnpm 11 ignores it with a warning and pnpm 10.17.1
# — the version `packageManager` pins, and therefore the only one CI runs —
# still honours it. That combination is the bad one. It works in CI, it works
# for whoever wrote it, and it silently stops working for the first person whose
# pnpm is newer than the pin, at which point `next`'s exact `postcss@8.4.31`
# returns and no test fails.
onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

overrides:
  postcss: '>=8.5.23'

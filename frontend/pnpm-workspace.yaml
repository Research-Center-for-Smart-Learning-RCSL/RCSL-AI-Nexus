# pnpm 10 stopped reading these from the `pnpm` field in package.json. The
# allowlist below lived there until 2026-07-26 and was being silently ignored,
# which left the intent stated in one file and enforced nowhere (security.md
# §10). Everything pnpm-configurable belongs here, not there.
#
# `overrides` joined them on 2026-08-04 for the same reason: it was written into
# `package.json` first, where pnpm 11 ignores it with a warning and pnpm 10.17.1
# — the version `packageManager` pins, and therefore the only one CI runs —
# still honours it. That combination is the bad one. It works in CI, it works
# for whoever wrote it, and it silently stops working for the first person whose
# pnpm is newer than the pin, at which point `next`'s exact `postcss@8.4.31`
# returns and no test fails.
onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

overrides:
  postcss: '>=8.5.23'
  # `next` declares sharp as an optional dependency and pins the minor, so the
  # libvips advisories (CVE-2026-33327/33328/35590/35591) could not be reached
  # from here until 0.35.0 shipped. This is not a dead dependency: two screens
  # render `next/image`, and the standalone server uses sharp to optimise them.
  sharp: '>=0.35.0'
  # `shadcn` -> `@modelcontextprotocol/sdk` -> `ajv` pulls in fast-uri 3.1.4.
  # GHSA-7p8r-x3mc-p8w7 (CVE-2026-18446): fast-uri < 3.1.5 treats `\\`, `/\`,
  # or `\/` as having no URI authority, folding the rest into the path, while
  # Node's WHATWG URL (fetch/undici/http) treats `\` like `/` for special
  # schemes and extracts a different host from the same string. Dev-only
  # (shadcn CLI), never reaches the build output, but the fix is a one-line
  # floor and there is no reason to carry a host-confusion bug even there.
  fast-uri: '^3.1.5'
  # `shadcn` -> `@modelcontextprotocol/sdk` -> `express-rate-limit` pulls in
  # ip-address 10.2.0. CVE-2026-69192 (GHSA-mwp4-54f8-5fhr): `Address4` decodes
  # a leading-zero octet as decimal while URL/DNS resolvers decode it as octal,
  # so `isPrivate()`-style SSRF guards can misclassify an internal address as
  # public. Development-only dependency (shadcn CLI), never reaches the build
  # output, but the fix is a one-line floor and there is no reason to carry it.
  ip-address: '>=10.3.1'
  # GHSA-4cwx-7wf7-3272 (CVE-2026-13697): undici's cache interceptor can leak
  # a private response into the shared cache, or crash, on malformed
  # `Cache-Control: private` directives. Dev-only (jsdom, shadcn, dotenvx pull
  # it in transitively), and every dependent already declares a `^7.x` range
  # that accepts the patch, so this stays on the 7.x line rather than letting
  # an unbounded range jump to 8.x, which jsdom 29's own range doesn't cover.
  undici: '^7.29.0'

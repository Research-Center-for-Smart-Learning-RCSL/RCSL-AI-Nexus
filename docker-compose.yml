# Deployment topology for the Mac Studio.
#
# Two rules govern every port mapping here, and both are easy to break by
# "tidying up" (see docs/architecture/security.md sections 3.2, 3.3):
#
#  1. Nothing is published on 0.0.0.0. On Docker Desktop a bare "5432:5432"
#     binds to every host interface, which puts the database on the LAN.
#     Host-side binds are either 127.0.0.1 or the tailnet address.
#  2. Inside a container uvicorn still binds 0.0.0.0, otherwise the published
#     port forwards to nothing. Rule 1 is about the left of the colon only.
#
# Secrets are files, not environment variables (security.md sections 6, 8): a
# value in `environment` or an `env_file` shows up in `docker inspect` and in
# the process list, so every credential here is a Docker secret mounted under
# /run/secrets and read through pydantic-settings `secrets_dir`. `.env` carries
# only non-secret configuration. See docs/architecture/deployment.md section 10
# and ./secrets/README.md.
#
# Model runtimes are absent on purpose: Ollama and MLX run natively on macOS
# because containers there cannot reach the GPU. See docs/ARCHITECTURE.md 0.1.

name: rcsl-ai-nexus

# Container logs, capped. The `json-file` driver's default is **no rotation**,
# and neither Compose nor the daemon on this machine set one, so every service
# was writing a file that only ever grew — silently, and first on the gateway,
# which logs a line per request. 10 MB times three files is 30 MB per service
# and around 330 MB for the stack, which is a ceiling rather than an estimate.
#
# `docker compose logs` reads only what is still on disk, so this also decides
# how far back an incident can be investigated. That is the trade: an unbounded
# log answers every question until the day it fills the disk and then answers
# none. Prometheus keeps 30 days of metrics and the audit log keeps its own
# history in Postgres; these files are for tracebacks and startup failures,
# which are read within hours or not at all.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Only `migrate` carries the build definition for this image, and only
# `frontend-tailnet` for the frontend one. Declaring `build:` on every service
# that shares a tag makes Compose build them in parallel, and they then race to
# write the same tag ("image ... already exists"). Everything else references
# the tag, which exists by the time it is needed because `migrate` is a
# dependency of every backend service.
x-backend: &backend
  image: rcsl-ai-nexus:latest
  restart: unless-stopped
  logging: *logging
  env_file: [.env]
  environment:
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    MLX_BASE_URL: ${MLX_BASE_URL:-http://host.docker.internal:8080}
    # The MLX adapter downloads snapshots here; the mount below makes this the
    # host cache the native mlx_lm.server reads. See adapters/runtime/mlx_adapter.py.
    HF_HOME: /hf-cache
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # The GeoLite2 country database, read-only. build_geo_filter refuses to
    # start in production when ALLOWED_COUNTRIES is set and this file is absent
    # (interfaces/http/middleware/geo_filter.py §4.1), so the gateway and the
    # public admin entrance both need it. Populate ./data/GeoLite2-Country.mmdb
    # before starting; see docs/runbooks/first-deploy.md.
    - ./data:/data:ro
    # The HuggingFace cache the MLX adapter downloads into, shared with the
    # host-native mlx_lm.server that serves those weights. Writable, unlike the
    # GeoLite2 mount: this is the one place a container writes onto a host path,
    # and it holds model files only. On the Mac Studio, HF_CACHE_HOST_PATH points
    # at the runtime account's ~/.cache/huggingface. See docs/architecture/deployment.md.
    - ${HF_CACHE_HOST_PATH:-./data/hf-cache}:/hf-cache
  depends_on:
    migrate:
      condition: service_completed_successfully

# Every backend service and the migration job must be able to read the four
# crypto secrets (api_key_pepper, totp_encryption_key, session_signing_key,
# proxy_shared_secret); without them Settings refuses to start in production
# (config.py `_refuse_placeholder_secrets_in_production`). They are listed
# explicitly per service rather than shared through a YAML anchor, because a
# `secrets` list is a sequence and an anchor splices in as one nested item, not
# as flattened entries. Each service gets those four plus whatever its role
# needs: a database URL, and redis for the two that hold sessions or counters.

# The invariant these networks exist to hold: the gateway shares no network
# with either admin entrance. The tailnet entrance trusts `Tailscale-User-Login`
# outright, so any container that can reach it by service name can forge an
# administrator. Socket binding isolates the host-published port, not the Docker
# service name, so a compromised gateway on a shared network could `curl
# http://admin-tailnet:8001` with a forged header. The data plane and the
# control plane therefore get separate database segments; postgres and redis are
# the only members of both, and they initiate no connections, so a shared
# datastore is not a shared path. See docs/architecture/security.md sections 1,
# 3.2, 5.1.
networks:
  # The gateway's own two networks. `gateway-egress` is non-internal so it can
  # reach the host runtime through host.docker.internal; nothing else is on it.
  gateway-egress:
  gateway-data:
    internal: true

  # One control network per entrance, each carrying a frontend and its admin
  # API and nothing else. Separate so a compromised public frontend cannot
  # reach the tailnet entrance and forge a header. Non-internal because the
  # admin entrances reach the host runtime for /admin/chat.
  control-tailnet:
  control-public:

  # The control plane's database segment. Both admin entrances are the same
  # trust tier (§1), so they share it; the gateway is not on it.
  admin-data:
    internal: true

  # The document parser and nothing else. Internal, so the container that reads
  # attacker-supplied PDFs has no route to the internet; and separate from
  # `admin-data`, so it has no route to Postgres or Redis either. Only the two
  # admin entrances are on it with the parser, because ingestion is an
  # administrative operation and the gateway never parses anything.
  # See docs/architecture/security.md section 7.3.
  parser-net:
    internal: true

  # Scrape segments, kept separate so the gateway/admin invariant above still
  # holds: Prometheus is on both, but the gateway and the admin entrances never
  # share one. Prometheus is a scraper, not a router — it issues only the fixed
  # GET /metrics in prometheus/prometheus.yml — so a compromised gateway cannot
  # use it to reach an admin entrance. Both internal: Prometheus reaches its
  # scrape targets and nothing else, and has no route off the machine.
  metrics-gateway:
    internal: true
  metrics-admin:
    internal: true
  # Grafana to Prometheus only, and internal so that Prometheus — which is also
  # on the two networks above, and is therefore the one container spanning the
  # gateway and admin trust tiers — gains no egress from being reachable here.
  metrics-viz:
    internal: true
  # Grafana's host port, and nothing else. Docker cannot publish a port into an
  # internal network: with no gateway address there is no route from the host,
  # and the daemon refuses with `no suitable container IP found` — which is a
  # warning, not an error, so the container starts healthy and the port is
  # simply absent. Grafana's 127.0.0.1:3002 had never once bound because of
  # this; it was found on 2026-07-26 while investigating a separate reboot
  # fault, not by anything noticing the port was missing.
  #
  # Publishing therefore requires a non-internal network, and a non-internal
  # network necessarily grants that container egress — there is no Docker
  # bridge configuration that gives one without the other. This exists so the
  # cost is paid by Grafana alone rather than by dropping `internal` from
  # metrics-viz, which would hand the same egress to Prometheus. Grafana's
  # reasons to reach outward are already switched off above
  # (GF_ANALYTICS_REPORTING_ENABLED, GF_ANALYTICS_CHECK_FOR_UPDATES).
  viz-ingress:

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  # Uploaded knowledge base documents and their extracted text. A volume rather
  # than MinIO: one node, one filesystem, and MinIO would have added a service,
  # a set of default credentials to replace, and a CVE surface for features this
  # deployment does not use. See ARCHITECTURE.md section 6. It holds the team's
  # unpublished research, so it is the volume that most needs to be in the
  # encrypted backup (security.md section 9.4).
  documents:
  # The passage index. Rebuildable from `documents` by re-ingesting, so it is
  # the one volume here that a backup could skip; kept as a named volume anyway
  # because rebuilding it means embedding every document again.
  qdrant-data:

# Every secret is a file under ./secrets, git-ignored, populated per deployment.
# The three database URLs each name a different least-privilege account
# (security.md section 6): `owner` owns the schema and is used only by
# `migrate`; `gateway` may read every table and write only `usage_records`;
# `admin` has full DML and no DDL. `migrate` provisions the gateway and admin
# roles from their URLs (app.infrastructure.db_roles), so those two files are
# the single source of truth for each account's name and password.
secrets:
  owner_database_url:
    file: ./secrets/owner_database_url
  gateway_database_url:
    file: ./secrets/gateway_database_url
  admin_database_url:
    file: ./secrets/admin_database_url
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  api_key_pepper:
    file: ./secrets/api_key_pepper
  totp_encryption_key:
    file: ./secrets/totp_encryption_key
  session_signing_key:
    file: ./secrets/session_signing_key
  proxy_shared_secret:
    file: ./secrets/proxy_shared_secret
  # The bearer token Prometheus presents to every /metrics endpoint, and that
  # each backend reads as metrics_scrape_token. One file, mounted into both sides,
  # so they cannot drift.
  metrics_scrape_token:
    file: ./secrets/metrics_scrape_token
  # Grafana's initial admin password, replacing its admin/admin default.
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  # Qdrant ships with no authentication at all, so this is not a hardening step
  # but the only thing standing between anything on the admin network and a full
  # read of the knowledge base. One file, set on the service through
  # QDRANT__SERVICE__API_KEY and read by the backends as qdrant_api_key, so the
  # two cannot drift. Required to be a real value in production unconditionally
  # (config.py); there is no deployment shape where the placeholder is intended.
  qdrant_api_key:
    file: ./secrets/qdrant_api_key
  # Qdrant's read-only key, and the vector store's half of the section 6
  # least-privilege split. The gateway retrieves passages to answer a request
  # and must never be able to add, alter or delete one, exactly as it may read
  # every table but write only `usage_records`. Mounted at the same target name,
  # so the gateway's settings read a key that simply cannot write.
  qdrant_read_only_api_key:
    file: ./secrets/qdrant_read_only_api_key

services:
  # --- one-shot schema migration and provisioning ------------------------
  # Not run from an application entrypoint: three containers start from the
  # same image and would race each other. Connects as the schema owner (the
  # only place that account is used), then creates the gateway and admin roles
  # and their grants before any application starts.
  migrate:
    build:
      context: ./backend
    image: rcsl-ai-nexus:latest
    logging: *logging
    command:
      - sh
      - -c
      - "alembic upgrade head && python -m app.infrastructure.db_roles && python -m app.infrastructure.provision"
    env_file: [.env]
    networks: [admin-data]
    restart: "no"
    secrets:
      # Owner URL is what this job connects as; the other two are read to learn
      # the gateway and admin account names and passwords (db_roles.py).
      - source: owner_database_url
        target: database_url
      - gateway_database_url
      - admin_database_url
      - api_key_pepper
      - totp_encryption_key
      - session_signing_key
      - proxy_shared_secret
      # Read only so get_settings() does not trip the production placeholder
      # check; this job scrapes nothing and indexes nothing.
      - metrics_scrape_token
      - qdrant_api_key
    depends_on:
      postgres:
        condition: service_healthy

  # --- data plane ---------------------------------------------------------
  gateway:
    <<: *backend
    command:
      - uvicorn
      - app.infrastructure.main_gateway:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    ports:
      # Reachable only from the tailnet, and the Tailscale ACL narrows that
      # further to the proxy host alone.
      - "${TAILNET_IP:?set TAILNET_IP in .env; an empty value publishes on 0.0.0.0}:8000:8000"
    # Deliberately not on any control network. The data plane reaches only the
    # database, the host runtime, and (for scraping) Prometheus; it has no path
    # to an admin entrance. metrics-gateway carries only this service and Prometheus.
    networks: [gateway-egress, gateway-data, metrics-gateway]
    secrets:
      # The gateway account: reads every table, writes only usage_records.
      - source: gateway_database_url
        target: database_url
      - redis_password
      - api_key_pepper
      - totp_encryption_key
      - session_signing_key
      - proxy_shared_secret
      - metrics_scrape_token
      # The read-only key, mounted at the name the settings read. The gateway
      # retrieves passages to answer a request and cannot write one, the same
      # least-privilege split its database account has.
      - source: qdrant_read_only_api_key
        target: qdrant_api_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- control plane, tailnet entrance ------------------------------------
  admin-tailnet:
    <<: *backend
    command:
      - uvicorn
      - app.infrastructure.main_admin_tailnet:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    networks: [control-tailnet, admin-data, metrics-admin, parser-net]
    # Repeated rather than merged: a service-level `volumes` replaces the
    # anchor's list outright, so the two mounts from x-backend are restated
    # alongside the documents volume. Read-write here, because ingestion writes
    # both the upload and its extracted text; the gateway gets no mount at all,
    # since retrieval reads chunk text from Qdrant and never touches the volume.
    volumes:
      - ./data:/data:ro
      - ${HF_CACHE_HOST_PATH:-./data/hf-cache}:/hf-cache
      - documents:/var/lib/nexus/documents
    secrets:
      - source: admin_database_url
        target: database_url
      - redis_password
      - api_key_pepper
      - totp_encryption_key
      - session_signing_key
      - proxy_shared_secret
      - metrics_scrape_token
      # The full key: ingestion creates the collection and writes passages.
      - qdrant_api_key

  # --- control plane, public entrance -------------------------------------
  # A separate service, not a second port on the one above: the two trust
  # models are incompatible and isolation must come from socket binding.
  admin-public:
    <<: *backend
    command:
      - uvicorn
      - app.infrastructure.main_admin_public:app
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
    ports:
      - "${TAILNET_IP:?set TAILNET_IP in .env; an empty value publishes on 0.0.0.0}:8002:8002"
    networks: [control-public, admin-data, metrics-admin, parser-net]
    volumes:
      - ./data:/data:ro
      - ${HF_CACHE_HOST_PATH:-./data/hf-cache}:/hf-cache
      - documents:/var/lib/nexus/documents
    secrets:
      - source: admin_database_url
        target: database_url
      - redis_password
      - api_key_pepper
      - totp_encryption_key
      - session_signing_key
      - proxy_shared_secret
      - metrics_scrape_token
      - qdrant_api_key

  # --- document parser ----------------------------------------------------
  # The container that reads attacker-supplied bytes, and the only one this
  # deployment assumes will fall (security.md section 7.3). Everything about it
  # is subtraction:
  #
  #   no env_file and no secrets  - it reads no settings, so a compromise finds
  #                                 no credential in its environment
  #   no volumes                  - a file-write primitive has nothing to write to
  #   parser-net only, internal   - no internet, and no route to Postgres, Redis
  #                                 or the vector store
  #   read_only root + tmpfs      - safe because the image sets
  #                                 PYTHONDONTWRITEBYTECODE and nothing here
  #                                 writes outside /tmp
  #   mem_limit                   - a decompression bomb kills this container
  #                                 rather than the host
  #
  # It is the same image as the backend with a different ASGI app, not a second
  # image: the isolation that matters is the process, network and credential
  # boundary, not which layers the code was built from.
  parser:
    image: rcsl-ai-nexus:latest
    restart: unless-stopped
    # Spelled out rather than merged from *backend: this service deliberately
    # takes none of that anchor's environment, mounts or dependencies.
    logging: *logging
    command:
      - uvicorn
      - app.parser.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    networks: [parser-net]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    # Only so the image tag exists before this starts; this service touches no
    # database and needs no schema. Same reason every other service waits on it.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- frontends ----------------------------------------------------------
  # One image, one instance per entrance, differing only in which admin API
  # the Next.js rewrite targets. Same-origin proxying avoids CORS entirely.
  frontend-tailnet:
    build:
      context: ./frontend
    image: rcsl-ai-nexus-frontend:latest
    logging: *logging
    restart: unless-stopped
    environment:
      ADMIN_API_URL: http://admin-tailnet:8001
    ports:
      - "127.0.0.1:3000:3000"
    networks: [control-tailnet]
    depends_on: [admin-tailnet]

  frontend-public:
    # Built by frontend-tailnet above; see the note at the top of this file.
    image: rcsl-ai-nexus-frontend:latest
    logging: *logging
    restart: unless-stopped
    environment:
      ADMIN_API_URL: http://admin-public:8002
    ports:
      - "${TAILNET_IP:?set TAILNET_IP in .env; an empty value publishes on 0.0.0.0}:3001:3000"
    networks: [control-public]
    depends_on: [admin-public]

  # --- data tier ----------------------------------------------------------
  # No published ports at all. Reached by service name from the data network.
  postgres:
    image: postgres:17-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      # File, not a value: the superuser password never enters the environment.
      # The owner_database_url secret must carry this same password.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # On both database segments. It accepts connections; it never opens one, so
    # being reachable from the gateway and from the admin plane does not make
    # those two reachable to each other.
    networks: [gateway-data, admin-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The passage index for the knowledge base. Like postgres and redis it sits on
  # both database segments and initiates nothing, so being reachable from the
  # gateway and from the admin plane does not make those two reachable to each
  # other. Publishes no port: an unauthenticated Qdrant is a full read of the
  # research data, and the key below is what makes it authenticated at all.
  qdrant:
    image: qdrant/qdrant:v1.13.0
    logging: *logging
    restart: unless-stopped
    environment:
      # Read from the mounted files through a shell, so neither key appears in
      # `environment` or in `docker inspect`. Qdrant has no `_FILE` convention,
      # the same gap redis has.
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT: "false"
    command:
      - sh
      - -c
      - 'export QDRANT__SERVICE__API_KEY="$(cat /run/secrets/qdrant_api_key)" QDRANT__SERVICE__READ_ONLY_API_KEY="$(cat /run/secrets/qdrant_read_only_api_key)"; exec ./entrypoint.sh'
    secrets:
      - qdrant_api_key
      - qdrant_read_only_api_key
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [gateway-data, admin-data]
    healthcheck:
      # bash's /dev/tcp, not curl or wget: the Qdrant image ships neither, and a
      # healthcheck calling a binary that is not there fails forever while
      # `docker compose config` validates happily. Found by running the
      # container rather than by reading the file. `/healthz` needs no key; the
      # data endpoints do.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q '200 OK'"
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    logging: *logging
    restart: unless-stopped
    # Redis ships with no password at all. Even on an internal network this is
    # set, because the gateway sits on redis's network legitimately (for
    # rate-limit counters), and a compromised gateway is the case the password
    # defends against. Read from the mounted secret via a shell so the value
    # never appears in `environment`; redis has no `_FILE` convention.
    command:
      - sh
      - -c
      - 'exec redis-server --requirepass "$(cat /run/secrets/redis_password)" --appendonly yes'
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks: [gateway-data, admin-data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$(cat /run/secrets/redis_password)\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- observability ------------------------------------------------------
  # Prometheus scrapes the three applications; Grafana reads Prometheus. See
  # docs/architecture/security.md section 6 for why neither may be public:
  # Prometheus has no authentication and Grafana ships with admin/admin.
  prometheus:
    image: prom/prometheus:v3.1.0
    logging: *logging
    restart: unless-stopped
    # No published port at all. Reachable only by Grafana over metrics-viz, and
    # scraping the apps over metrics-gateway and metrics-admin. Exposing it would
    # publish an unauthenticated read of every internal series.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [metrics-gateway, metrics-admin, metrics-viz]
    secrets:
      # Presented as the bearer token to each /metrics; see prometheus/prometheus.yml.
      - metrics_scrape_token

  grafana:
    image: grafana/grafana:11.5.1
    logging: *logging
    restart: unless-stopped
    # The three hardening points security.md section 6 requires of Grafana:
    # replace the default password (from a file secret, not the environment),
    # and disable both anonymous access and self-registration.
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      # Loopback only, exposed to the tailnet through `tailscale serve --https
      # 8443 http://127.0.0.1:3002`. Never published on 0.0.0.0.
      - "127.0.0.1:3002:3000"
    # viz-ingress carries the host port; metrics-viz carries the Prometheus
    # datasource. See the networks block for why they have to be two.
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [metrics-viz, viz-ingress]
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus
